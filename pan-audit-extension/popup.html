<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body { font-family: system-ui, sans-serif; width: 220px; padding: 14px; }
    h1 { font-size: 14px; margin: 0 0 12px; }
    button {
      display: block; width: 100%; padding: 8px 10px; margin-bottom: 8px;
      border: 1px solid #d0d0d0; border-radius: 6px; background: #fafafa;
      cursor: pointer; font-size: 13px;
    }
    button:hover { background: #f0f0f0; }
    button.primary { background: #1a5fb4; color: white; border-color: #1a5fb4; }
    button.primary:hover { background: #164e94; }
  </style>
</head>
<body>
  <h1>PAN-OS Config Auditor</h1>
  <button id="openDashboard" class="primary">Open Dashboard</button>
  <button id="openOptions">Manage Connections</button>
  <script src="popup.js" type="module"></script>
</body>
</html>
